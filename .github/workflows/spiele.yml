name: Spiele laden

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Spiele von fussball.de holen
        run: python spiele_laden.py

      - name: spiele.js einchecken
        run: |
          git config user.name "spiele-bot"
          git config user.email "actions@users.noreply.github.com"
          git add spiele.js
          git diff --cached --quiet || git commit -m "Spiele aktualisiert"
          git push
